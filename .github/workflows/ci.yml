name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Versions match Cargo.toml
        run: bash scripts/check-versions.sh
      - name: Reject PDFs and tracked secret files
        run: bash .github/scripts/check-repo.sh
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings -D clippy::missing_docs_in_private_items
      - name: Test
        run: cargo test --locked
      - name: Rustdoc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --document-private-items --locked
      - name: Release build
        run: cargo build --release --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the npm launcher
        run: |
          node --check npm/njt-mcp/bin/njt-mcp.js
          node --test npm/njt-mcp/test/release.test.js
      - name: cargo publish dry run
        run: cargo publish --dry-run --locked
